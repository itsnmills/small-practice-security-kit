name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks secret scan
        run: gitleaks detect --source . --no-git --redact --config .gitleaks.toml
      - name: Install Bandit and pip-audit
        run: |
          python -m pip install --disable-pip-version-check bandit pip-audit
      - name: Run Bandit AST code security scan
        run: bandit -r small_practice_security_kit -c .bandit
      - name: Run pip-audit dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Resolve Python dependencies for Trivy
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/spsk-trivy-venv"
          "$RUNNER_TEMP/spsk-trivy-venv/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          mkdir -p "$RUNNER_TEMP/spsk-trivy-dependencies"
          "$RUNNER_TEMP/spsk-trivy-venv/bin/python" -m pip freeze --local > "$RUNNER_TEMP/spsk-trivy-dependencies/requirements.txt"
          test -s "$RUNNER_TEMP/spsk-trivy-dependencies/requirements.txt"
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
      - name: Run Trivy secret and misconfiguration scan
        run: trivy fs --scanners secret,misconfig --severity CRITICAL,HIGH --exit-code 1 --no-progress .
      - name: Run Trivy vulnerability scan on resolved Python dependencies
        run: trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --no-progress "$RUNNER_TEMP/spsk-trivy-dependencies"
      - name: Generate Trivy CycloneDX SBOM
        run: trivy fs --format cyclonedx --output trivy-sbom.cdx.json --no-progress "$RUNNER_TEMP/spsk-trivy-dependencies"
      - name: Require SBOM components
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sbom = json.loads(Path("trivy-sbom.cdx.json").read_text(encoding="utf-8"))
          components = sbom.get("components", [])
          if not components:
              raise SystemExit("Trivy generated an SBOM with no resolved Python dependency components")
          print(f"Trivy SBOM contains {len(components)} resolved Python dependency components")
          PY
      - name: Upload Trivy SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-cyclonedx-sbom
          path: trivy-sbom.cdx.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate sample profile
        run: python -m small_practice_security_kit validate samples/family_dental_clinic.yaml
      - name: Build sample packet
        run: python -m small_practice_security_kit build samples/family_dental_clinic.yaml
      - name: Build local intake dashboard
        run: python scripts/serve_dashboard.py --profile samples/family_dental_clinic.yaml --build-only
      - name: Export evidence binder index
        run: python -m small_practice_security_kit export-binder samples/family_dental_clinic.yaml
      - name: Export public demo artifact
        run: python -m small_practice_security_kit export-demo --profile samples/family_dental_clinic.yaml --output /tmp/spsk-demo-export
      - name: Import ePHI flows
        run: python scripts/import_ephi_flows.py examples/imports/ephi-data-flow-mapper/flows.csv --base samples/family_dental_clinic.yaml --output out/family_dental_clinic/imported-ephi-profile.yaml
      - name: Build imported ePHI profile
        run: python scripts/build.py out/family_dental_clinic/imported-ephi-profile.yaml
      - name: Import vendor register
        run: python scripts/import_vendor_register.py examples/imports/vendor-risk-manager/vendor_register.csv --base samples/family_dental_clinic.yaml --output out/family_dental_clinic/imported-vendor-profile.yaml
      - name: Build imported vendor profile
        run: python scripts/build.py out/family_dental_clinic/imported-vendor-profile.yaml
      - name: Validate content
        run: python scripts/validate_content.py
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Upload demo packet artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spsk-demo-packet
          path: |
            /tmp/spsk-demo-export/review-packet.md
            /tmp/spsk-demo-export/review-packet.html
            /tmp/spsk-demo-export/packet-manifest.json
            /tmp/spsk-demo-export/readiness-review.md
            /tmp/spsk-demo-export/ephi-flow-map.md
            /tmp/spsk-demo-export/vendor-baa-review.md
            /tmp/spsk-demo-export/ai-workflow-review.md
            /tmp/spsk-demo-export/downtime-ransomware-tabletop.md
            /tmp/spsk-demo-export/evidence-binder-index.md
            /tmp/spsk-demo-export/owner-msp-handoff.md
            /tmp/spsk-demo-export/30-60-90-roadmap.md
            /tmp/spsk-demo-export/limitations-appendix.md
            /tmp/spsk-demo-export/evidence-binder-export/*
            /tmp/spsk-demo-export/review-packet.png
          if-no-files-found: ignore
