practice:
  name: "Family Dental Clinic"
  type: "Dental practice"
  staff_count: 14
  locations: 1
  review_period: "2026 Q2"
  security_owner: "Office Manager"
  technical_owner: "MSP Lead"

readiness:
  mfa_email: true
  mfa_ehr: false
  unique_accounts: true
  quarterly_access_review: false
  tested_backups: false
  vendor_inventory: true
  baa_register: false
  incident_contact_list: true
  downtime_plan: false
  security_training_current: true
  log_review_cadence: false

systems:
  - name: "Cloud EHR"
    category: "EHR"
    ephi_role: "creates, receives, maintains, transmits"
    owner: "Practice Owner"
    vendor: "Example EHR Vendor"
    access_method: "browser"
    evidence_needed: "admin settings export, BAA, user access review"
  - name: "Billing Portal"
    category: "Billing"
    ephi_role: "receives, maintains, transmits"
    owner: "Billing Lead"
    vendor: "Example Billing Vendor"
    access_method: "browser"
    evidence_needed: "BAA, user list, incident contact"
  - name: "Shared Drive"
    category: "File storage"
    ephi_role: "maintains"
    owner: "Office Manager"
    vendor: "Workspace Provider"
    access_method: "managed endpoint and browser"
    evidence_needed: "access review, sharing settings, backup reference"
  - name: "Dental Imaging Workstation"
    category: "Imaging"
    ephi_role: "creates and maintains"
    owner: "Lead Dental Assistant"
    vendor: "Example Imaging Vendor"
    access_method: "local workstation and vendor support session"
    evidence_needed: "local account list, backup scope reference, vendor support access procedure"
  - name: "Patient Messaging Portal"
    category: "Patient communications"
    ephi_role: "receives and transmits"
    owner: "Front Desk Lead"
    vendor: "Example Messaging Vendor"
    access_method: "browser"
    evidence_needed: "BAA, secure message settings, retention settings"
  - name: "General AI Assistant"
    category: "AI drafting"
    ephi_role: "no PHI approved for public demo workflow"
    owner: "Office Manager"
    vendor: "General AI Assistant Vendor"
    access_method: "browser"
    evidence_needed: "staff no-PHI guidance, acceptable-use acknowledgement"
  - name: "AI Scribe Pilot"
    category: "AI documentation"
    ephi_role: "potentially receives or creates ePHI if approved later"
    owner: "Practice Owner"
    vendor: "Example AI Scribe Vendor"
    access_method: "browser and mobile app"
    evidence_needed: "BAA review, retention terms, human review process, pilot approval"

flows:
  - id: "FLOW-001"
    source: "Patient intake form"
    destination: "Cloud EHR"
    ephi_type: "demographic and insurance categories"
    vendor: "Example EHR Vendor"
    transmission: "HTTPS portal"
    baa_needed: true
    risk: "medium"
    evidence_needed: "BAA, portal access controls, intake workflow owner"
  - id: "FLOW-002"
    source: "Cloud EHR"
    destination: "Billing Portal"
    ephi_type: "billing and payer-submission categories"
    vendor: "Example Billing Vendor"
    transmission: "vendor integration"
    baa_needed: true
    risk: "high"
    evidence_needed: "BAA, integration owner, incident notification terms"
  - id: "FLOW-003"
    source: "Staff email"
    destination: "External specialist"
    ephi_type: "referral attachments"
    vendor: "Email provider"
    transmission: "email"
    baa_needed: true
    risk: "high"
    evidence_needed: "secure email policy, forwarding review, staff training"
  - id: "FLOW-004"
    source: "Dental Imaging Workstation"
    destination: "Shared Drive"
    ephi_type: "image export categories"
    vendor: "Workspace Provider"
    transmission: "manual export"
    baa_needed: true
    risk: "high"
    evidence_needed: "export procedure, shared-folder access review, backup scope reference"
  - id: "FLOW-005"
    source: "Front desk notes"
    destination: "General AI Assistant"
    ephi_type: "no patient data approved; generic administrative drafting only"
    vendor: "General AI Assistant Vendor"
    transmission: "browser prompt"
    baa_needed: false
    risk: "medium"
    evidence_needed: "AI acceptable-use guidance and staff acknowledgement"
  - id: "FLOW-006"
    source: "Provider conversation"
    destination: "AI Scribe Pilot"
    ephi_type: "potential visit-summary categories if approved after vendor review"
    vendor: "Example AI Scribe Vendor"
    transmission: "vendor app"
    baa_needed: true
    risk: "high"
    evidence_needed: "BAA, retention terms, model-training terms, human review approval"

vendors:
  - name: "Example EHR Vendor"
    service: "EHR hosting and support"
    touches_ephi: true
    baa_status: "signed"
    soc2_status: "not provided"
    hitrust_status: "not provided"
    ai_training_use: "not reviewed"
    subcontractors_known: "partial"
    incident_notification_terms: "24 hours in contract"
    risk: "medium"
  - name: "Example Billing Vendor"
    service: "Claims and billing"
    touches_ephi: true
    baa_status: "missing review date"
    soc2_status: "not provided"
    hitrust_status: "not provided"
    ai_training_use: "unknown"
    subcontractors_known: "unknown"
    incident_notification_terms: "unknown"
    risk: "high"
  - name: "Workspace Provider"
    service: "Email, calendar, and shared drive"
    touches_ephi: true
    baa_status: "signed"
    soc2_status: "not provided"
    hitrust_status: "not provided"
    ai_training_use: "not reviewed for add-on AI features"
    subcontractors_known: "published list not reviewed"
    incident_notification_terms: "portal notice terms need review"
    risk: "medium"
  - name: "Example Imaging Vendor"
    service: "Dental imaging software and support"
    touches_ephi: true
    baa_status: "unknown"
    soc2_status: "not provided"
    hitrust_status: "not provided"
    ai_training_use: "not applicable in current deployment"
    subcontractors_known: "unknown"
    incident_notification_terms: "unknown"
    risk: "high"
  - name: "General AI Assistant Vendor"
    service: "Administrative drafting assistant"
    touches_ephi: false
    baa_status: "not needed for no-PHI demo workflow"
    soc2_status: "not applicable"
    hitrust_status: "not applicable"
    ai_training_use: "consumer/default settings not approved for sensitive data"
    subcontractors_known: "not reviewed"
    incident_notification_terms: "not reviewed"
    risk: "medium"
  - name: "Example AI Scribe Vendor"
    service: "AI scribe pilot"
    touches_ephi: true
    baa_status: "requested"
    soc2_status: "not provided"
    hitrust_status: "not provided"
    ai_training_use: "unknown"
    subcontractors_known: "unknown"
    incident_notification_terms: "unknown"
    risk: "high"

ai_workflows:
  - name: "Marketing email drafting"
    proposed_use: "Draft generic outreach copy"
    data_used: "No patient data"
    vendor: "General AI assistant"
    decision: "allowed"
    evidence_needed: "staff guidance and prohibited data examples"
  - name: "Insurance renewal questionnaire drafting"
    proposed_use: "Draft plain-language answers for cyber insurance renewal questions"
    data_used: "Control status summaries and evidence reference IDs only"
    vendor: "General AI assistant"
    decision: "allowed"
    evidence_needed: "owner review and no-PHI/no-secret prompt guidance"
  - name: "Billing appeal drafter"
    proposed_use: "Draft payer appeal language"
    data_used: "billing scenario summary; real patient-level details are not approved"
    vendor: "General AI assistant"
    decision: "restricted"
    evidence_needed: "BAA review, redaction workflow, owner approval"
  - name: "AI scribe pilot"
    proposed_use: "Draft visit summaries after provider review"
    data_used: "potential PHI if enabled after vendor approval"
    vendor: "Example AI Scribe Vendor"
    decision: "restricted"
    evidence_needed: "BAA, retention/model-training terms, human review workflow, pilot owner signoff"
  - name: "Paste patient-level note into public chatbot"
    proposed_use: "Summarize patient-level documentation"
    data_used: "patient-level documentation category"
    vendor: "Public chatbot"
    decision: "prohibited"
    evidence_needed: "training reminder and AI use policy"

external_precheck:
  status: "synthetic demo observations only"
  authorization: "Demo data only. For a real practice, run public-site checks only with written authorization, no real patient submissions, and reference-only evidence."
  scope:
    domains:
      - "familydental.example"
    workflows:
      - name: "Appointment scheduler"
        workflow_type: "scheduler"
        url_label: "https://familydental.example/appointments"
        patient_data_context: "appointment request categories; no real form submission in demo"
      - name: "New patient intake"
        workflow_type: "intake"
        url_label: "https://familydental.example/new-patient"
        patient_data_context: "demographic and insurance categories; no real form submission in demo"
      - name: "Patient portal login"
        workflow_type: "portal"
        url_label: "https://portal.familydental.example"
        patient_data_context: "authenticated portal context to review with vendor"
  findings:
    - id: "EXT-TRACKER-SCHEDULER-001"
      category: "patient_intake_tracker"
      title: "Third-party tracker observed on appointment scheduler"
      severity: "high"
      page_label: "Appointment scheduler"
      url_label: "https://familydental.example/appointments"
      observed_technology: "Meta Pixel"
      network_destination: "connect.facebook.net and graph.facebook.com"
      status: "observed"
      owner: "Office Manager"
      next_action: "Ask the website vendor and qualified privacy reviewer whether this tracker should be removed or restricted on scheduler pages."
    - id: "EXT-TRACKER-INTAKE-002"
      category: "patient_intake_tracker"
      title: "Analytics tag observed on new patient intake page"
      severity: "high"
      page_label: "New patient intake"
      url_label: "https://familydental.example/new-patient"
      observed_technology: "Google Tag Manager and Google Analytics"
      network_destination: "googletagmanager.com and google-analytics.com"
      status: "observed"
      owner: "Office Manager"
      next_action: "Ask the website vendor to document tag purpose, data sent, and whether the intake workflow should suppress analytics tags pending reviewer decision."
    - id: "EXT-TLS-PORTAL-003"
      category: "public_tls"
      title: "Patient portal TLS and certificate evidence needs confirmation"
      severity: "medium"
      page_label: "Patient portal login"
      url_label: "https://portal.familydental.example"
      observed_technology: "HTTPS certificate and redirect posture"
      network_destination: "portal.familydental.example"
      status: "requested"
      owner: "MSP Lead"
      next_action: "Ask the MSP or portal vendor for TLS scan summary, certificate expiry, redirect behavior, HSTS status, and covered host list."

downtime:
  critical_systems:
    - "Cloud EHR"
    - "Billing Portal"
    - "Phones"
    - "Shared Drive"
  last_restore_test: ""
  downtime_plan_status: "not documented"
  tabletop_status: "not run"

incident_timeline:
  scenario_name: "Suspicious login and EHR downtime tabletop"
  scenario_type: "tabletop"
  summary: "Synthetic scenario: staff notice an unusual admin login alert shortly before the Cloud EHR becomes unavailable. The practice needs to keep care moving, preserve evidence references, and separate technical containment from qualified breach, insurance, contract, and regulatory decisions."
  sensitive_data_boundary: "Use categories, owners, timestamps, and evidence reference IDs only. Do not include PHI, patient identifiers, screenshots, raw logs, private URLs, credentials, vendor contracts, or real incident details."
  timeline:
    - time: "T+00"
      phase: "Detection"
      event: "Front desk reports the Cloud EHR is unavailable and the owner sees a suspicious admin-login alert category."
      systems:
        - "Cloud EHR"
        - "Email"
      owner: "Office Manager"
      evidence_ref: "restricted-evidence/incidents/tabletop-detection-note"
      status: "requested"
      decision_gate: "Is there active compromise, patient-care disruption, or vendor notice?"
    - time: "T+15"
      phase: "Continuity"
      event: "Practice switches to downtime workflow while the MSP checks whether the issue affects EHR, email, billing, or shared drive access."
      systems:
        - "Cloud EHR"
        - "Billing Portal"
        - "Shared Drive"
      owner: "Office Manager"
      evidence_ref: "restricted-evidence/incidents/downtime-workflow-reference"
      status: "requested"
      decision_gate: "Which manual workflow keeps care moving without creating new unsafe data copies?"
    - time: "T+30"
      phase: "Containment"
      event: "MSP confirms account, device, vendor-support, and remote-access categories that need review or containment."
      systems:
        - "Cloud EHR"
        - "Workspace Provider"
      owner: "MSP Lead"
      evidence_ref: "restricted-evidence/incidents/containment-action-reference"
      status: "requested"
      decision_gate: "Which accounts, tokens, sessions, or vendor paths should be disabled or reviewed first?"
    - time: "T+60"
      phase: "Qualified review"
      event: "Owner parks breach-notification, insurance, contract notice, and regulatory questions for qualified reviewers."
      systems:
        - "Cloud EHR"
        - "Example EHR Vendor"
      owner: "Qualified reviewer"
      evidence_ref: "restricted-evidence/incidents/qualified-review-queue"
      status: "requested"
      decision_gate: "Which facts and private evidence references must be prepared for counsel, insurer, vendor, or incident responder?"
    - time: "T+1 business day"
      phase: "After-action"
      event: "Practice assigns remediation owners for access review, MFA evidence, restore-test proof, vendor incident terms, and staff communication."
      systems:
        - "Cloud EHR"
        - "Billing Portal"
        - "Shared Drive"
      owner: "Practice Owner"
      evidence_ref: "restricted-evidence/incidents/after-action-items"
      status: "requested"
      decision_gate: "Which improvements must be completed in the next 30 days before the tabletop can be closed?"
  decision_gates:
    - gate: "Active compromise escalation"
      owner: "MSP Lead"
      trigger: "Ransomware indicator, active unauthorized access, lost device, vendor breach notice, or patient-care disruption."
      action: "Escalate to qualified incident response and preserve private evidence references."
    - gate: "Breach or notice review"
      owner: "Qualified reviewer"
      trigger: "Possible impermissible access, disclosure, contract notice, insurance notice, or regulatory reporting question."
      action: "Park for qualified legal, compliance, insurer, vendor, or incident-response review."
    - gate: "Operational continuity"
      owner: "Office Manager"
      trigger: "EHR, billing, phones, shared drive, or messaging portal unavailable during patient-care operations."
      action: "Use documented downtime workflow and record reference-only evidence of decisions and owner approvals."
  after_actions:
    - id: "INC-AA-001"
      priority: "high"
      owner: "MSP Lead"
      action: "Confirm MFA enforcement, session reset, administrator list, and access-review evidence for EHR and workspace accounts."
      evidence_needed: "Admin settings export reference, access review reference, session reset reference, and owner signoff."
      due: "30 days"
    - id: "INC-AA-002"
      priority: "high"
      owner: "Office Manager"
      action: "Update downtime workflow for Cloud EHR, Billing Portal, Phones, and Shared Drive."
      evidence_needed: "Downtime workflow reference, staff acknowledgement reference, and tabletop attendance reference."
      due: "30 days"
    - id: "INC-AA-003"
      priority: "medium"
      owner: "Practice Owner"
      action: "Review vendor incident terms and support contacts for EHR, billing, imaging, workspace, and AI scribe vendors."
      evidence_needed: "Vendor terms reference, security contact reference, BAA review date, and qualified-review notes."
      due: "60 days"
    - id: "INC-AA-004"
      priority: "medium"
      owner: "MSP Lead"
      action: "Run a restore-test evidence refresh for systems needed during patient-care continuity."
      evidence_needed: "Restore-test record reference, backup-scope reference, and exception list."
      due: "60 days"

