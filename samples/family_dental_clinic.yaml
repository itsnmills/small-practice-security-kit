handoff_questions:
  - audience: "MSP"
    stage_id: "access_offboarding_review"
    priority: "high"
    question: "Which EHR, billing, imaging, email, remote support, and administrator accounts have MFA technically enforced?"
    evidence_ref: "EVID-ACCESS-Q2"
    artifact_ref: "owner-msp-handoff.md"
  - audience: "MSP"
    stage_id: "downtime_ransomware_review"
    priority: "high"
    question: "Which systems are in backup scope, when was the last restore test, and what evidence reference proves it?"
    evidence_ref: "EVID-BACKUP-RESTORE"
    artifact_ref: "downtime-ransomware-tabletop.md"
  - audience: "Vendor"
    stage_id: "vendor_baa_review"
    priority: "high"
    question: "Can the billing, imaging, and AI scribe vendors confirm BAA scope, incident terms, subcontractors, and model-training posture?"
