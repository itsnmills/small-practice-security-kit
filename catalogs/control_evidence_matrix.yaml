schema_version: "2026-05-19"
description: "Velari starter control evidence matrix for small healthcare practice readiness exports."

common_unsafe_inputs: &common_unsafe_inputs
  - PHI or patient identifiers
  - credentials
  - private admin URLs
  - raw logs
  - patient screenshots
  - full private contracts

small_practice_applicability: &small_practice_applicability
  - small_practice
  - msp_supported
  - covered_entity
  - public_demo

controls:
