    control_family: Administrative Safeguards
    control_refs:
      - 45 CFR § 164.308(a)(2) Assigned Security Responsibility (Required)
      - NIST SP 800-66r2 § 5.1 Administrative Safeguards - Assigned Security Responsibility
      - HHS 405(d) HICP Sub-Practice 10.S.A Cybersecurity Oversight and Governance
      - CISA CPG 1.A Governance & Leadership
    risk_area: Governance
    practice_applicability: *small_practice_applicability
    evidence_id: EV-GOV-OWNER-001
    evidence_name: Accountable security owner record
    evidence_type: sanitized owner role record or practice attestation
    evidence_owner: owner
    evidence_provider: office_manager
    accountable_owner: owner
    reviewer_needed:
      - owner
      - velari_reviewer
    evidence_status: missing
    freshness_status: missing
    last_collected_at: null
    last_reviewed_at: null
    effective_date: null
    cadence: annual
    stale_after_days: 365
    retention_years: 6
    source_systems:
      - practice profile
      - management signoff packet
    acceptable_evidence:
      - named security owner role
      - dated owner acknowledgement
      - owner/MSP responsibility split
    unsafe_inputs: *common_unsafe_inputs
    linked_answer_packet_ids: []
    next_action: Confirm the named owner for security readiness decisions and where owner/MSP handoffs are recorded.

